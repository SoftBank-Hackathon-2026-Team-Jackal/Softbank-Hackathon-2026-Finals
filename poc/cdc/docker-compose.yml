# CDC PoC: pg-a(기존) → pg-b(새) 논리 복제, PgBouncer로 전환, 부하 생성기로 무중단 검증
name: cdc-poc

x-pg: &pg
  image: ${PG_IMAGE:-postgres:16}   # 물리 복사(06_physical_copy.sh)는 postgres:17 이상
  shm_size: 1gb   # 병렬 쿼리용 공유 메모리. 기본 64MB로는 대용량에서 실패한다
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=10
    - -c
    - max_wal_senders=10
    - -c
    - wal_sender_timeout=10s
    - -c
    - max_logical_replication_workers=8
    - -c
    - max_sync_workers_per_subscription=4
    - -c
    - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
    - -c
    - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    - -c
    - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
  environment:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: app
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  pg-a:
    <<: *pg
    volumes:
      - ./init/00-hba-replication.sh:/docker-entrypoint-initdb.d/00-hba-replication.sh:ro
      - ./init/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./init/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro

  pg-b:
    <<: *pg
    volumes:
      - ./init/00-hba-replication.sh:/docker-entrypoint-initdb.d/00-hba-replication.sh:ro
      - ./init/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - pg-b-data:/var/lib/postgresql/data

  # 물리 복사(B1): pg-b 를 멈춘 상태에서 pg-b 의 데이터 디렉터리를 pg_basebackup 으로 채우고
  # pg_createsubscriber 로 논리 구독자로 바꾼다. scenarios/06_physical_copy.sh 가 실행한다
  pg-b-clone:
    image: ${PG_IMAGE:-postgres:16}
    profiles: ["clone"]
    user: postgres
    working_dir: /tmp
    entrypoint: ["bash", "/poc/scripts/physical_clone.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      SRC_HOST: pg-a
      REPL_PASSWORD: replicator
      PUB_PASSWORD: postgres
    volumes:
      - ./scripts:/poc/scripts:ro
      - ./results:/poc/results
      - pg-b-data:/var/lib/postgresql/data

  pgbouncer:
    build: ./pgbouncer
    depends_on:
      pg-a: { condition: service_healthy }
      pg-b: { condition: service_healthy }
    volumes:
      - pgb-runtime:/etc/pgbouncer/runtime
    ports:
      - "6432:6432"

  loadgen:
    build: ./loadgen
    profiles: ["load"]
    depends_on: [pgbouncer]
    environment:
      DATABASE_URL: postgresql://app:app@pgbouncer:6432/app
      RATE: ${RATE:-50}
      WORKERS: ${WORKERS:-8}
      OUT_DIR: /results
    volumes:
      - ./results:/results

  # 스크립트 실행용. 실제 환경에서는 같은 스크립트를 URL만 바꿔 실행한다
  toolbox:
    build:
      context: ./toolbox
      args:
        PG_IMAGE: ${PG_IMAGE:-postgres:16}
    profiles: ["tools"]
    working_dir: /poc
    entrypoint: ["bash"]
    environment:
      PGPASSWORD: postgres
      PG_A_URL: postgresql://postgres:postgres@pg-a:5432/app
      PG_B_URL: postgresql://postgres:postgres@pg-b:5432/app
      PGB_ADMIN_URL: postgresql://postgres:postgres@pgbouncer:6432/pgbouncer
      PGB_RUNTIME: /pgb-runtime
      REPL_PASSWORD: replicator
    volumes:
      - ./scripts:/poc/scripts:ro
      - ./results:/poc/results
      - pgb-runtime:/pgb-runtime

volumes:
  pgb-runtime:
  pg-b-data:
